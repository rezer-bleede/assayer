name: data-qualitest-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qualitest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qualitest}
      POSTGRES_DB: ${POSTGRES_DB:-qualitest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qualitest}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${DB_PORT:-55432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PORT:-56379}:6379"

  # Optional local model runner. Enable with:  docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qualitest}:${POSTGRES_PASSWORD:-qualitest}@db:5432/${POSTGRES_DB:-qualitest}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app
      # sample ETL the agent (and the test suite) can read
      - ./examples:/app/examples:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${API_PORT:-8010}:8000"

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qualitest}:${POSTGRES_PASSWORD:-qualitest}@db:5432/${POSTGRES_DB:-qualitest}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./api:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys;sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time, so it must be a build arg.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8010}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8010}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3010}:3000"

volumes:
  pgdata:
  redisdata:
  ollama: