name: data-qualitest-agent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qualitest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qualitest}
      POSTGRES_DB: ${POSTGRES_DB:-qualitest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qualitest}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${DB_PORT:-55432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PORT:-56379}:6379"

  # The demo dataset (a deliberately dirty warehouse) is applied automatically
  # on first boot, so nothing has to be seeded by hand. Idempotent: it only
  # creates what is missing and never touches existing rows.
  demo-seed:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-qualitest}
      PGPASSWORD: ${POSTGRES_PASSWORD:-qualitest}
      PGDATABASE: ${POSTGRES_DB:-qualitest}
    volumes:
      - ./scripts/demo:/demo:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for f in /demo/*.sql; do
          echo "seeding $$f"
          psql -h db -v ON_ERROR_STOP=1 -f "$$f" || exit 1
        done
        echo "demo data ready"
    restart: "no"

  # Local model runner. On by default for Linux and Windows hosts — the app's
  # LLM settings point here, so a plain `docker compose up` gets a working
  # local model with no setup. On macOS, Docker cannot pass the Apple GPU to
  # containers (the model would run CPU-only, ~8 tok/s), so `make up` skips
  # this service pair in favour of a native, Metal-accelerated Ollama instead
  # (see the Makefile and README -> "Faster on macOS").
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    environment:
      # Default is 4096, which a thinking model can fill with reasoning alone —
      # leaving no room for the answer. Give it a real window.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${OLLAMA_PORT:-11435}:11434"

  # Pulls the model once, then exits. The API does not wait for it: until the
  # model is there the agent falls back to its deterministic planner.
  ollama-model:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:3b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-${LLM_MODEL:-qwen2.5-coder:3b}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${LLM_PROVIDER}" = "ollama" ]; then
          ollama pull $${OLLAMA_MODEL:-$${LLM_MODEL}}
        else
          echo "LLM_PROVIDER=$${LLM_PROVIDER}: no local model needed"
        fi
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qualitest}:${POSTGRES_PASSWORD:-qualitest}@db:5432/${POSTGRES_DB:-qualitest}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:3b}
      UI_ARTIFACT_DIR: /data/ui-artifacts
    volumes:
      - ./api:/app
      - ui-artifacts:/data/ui-artifacts
      # sample ETL the agent (and the test suite) can read
      - ./examples:/app/examples:ro
      # the demo dataset the stack seeds, so the test suite can guard it
      - ./scripts/demo:/app/demo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${API_PORT:-8010}:8000"

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qualitest}:${POSTGRES_PASSWORD:-qualitest}@db:5432/${POSTGRES_DB:-qualitest}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-coder:3b}
      UI_ARTIFACT_DIR: /data/ui-artifacts
    volumes:
      - ./api:/app
      - ui-artifacts:/data/ui-artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys;sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time, so it must be a build arg.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8010}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8010}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3010}:3000"

volumes:
  ui-artifacts:
  pgdata:
  redisdata:
  ollama:
